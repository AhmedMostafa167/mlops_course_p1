[project]
name = "s1-mini-project"
version = "0.1.0"
description = "mini project for mlops course covering simple model serving using API endpoint with testing, structured logging, and dockerization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "torch>=2.13.0",
    "uvicorn>=0.52.3",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
