[project]
name = "mlops_project"
version = "0.1.0"
description = "mini project for mlops course covering simple model serving using API endpoint with testing, structured logging, and dockerization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "fastapi>=0.129.0,<0.137.0",
    "numpy>=2.5.2",
    "pandas<3",
    "pre-commit>=4.6.2",
    "protobuf>=3.20,<5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "structlog>=26.1.0",
    "apache-airflow==3.3.1",
    "uvicorn>=0.52.3",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mlflow>=2.10",
    "torch>=2.7.0",
    "xgboost>=3.0.0",
    "ipykernel>=7.3.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "skl2onnx>=1.20.0",
    "onnxmltools>=1.16.0",
    "psycopg2-binary>=2.9.12",
    "boto3",
    "optuna>=4.9.0",
    "ruff>=0.16.5",
    "black>=26.5.1",
    "pytest-cov>=7.1.0",
    "graphviz>=0.21",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src/prodml --cov-fail-under=70"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
