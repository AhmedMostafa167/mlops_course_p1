[project]
name = "mlops_project"
version = "0.1.0"
description = "mini project for mlops course covering simple model serving using API endpoint with testing, structured logging, and dockerization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pandas<3",
    "protobuf>=3.20,<5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "structlog>=26.1.0",
    "uvicorn>=0.52.3",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mlflow>=2.10",
    "torch>=2.7.0",
    "xgboost>=3.0.0",
    "ipykernel>=7.3.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "skl2onnx>=1.20.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
