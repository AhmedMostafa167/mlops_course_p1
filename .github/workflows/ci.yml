name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EXPERIMENT_NAME: taxi-duration
      REGISTERED_MODEL_NAME: taxi-duration
      PRODUCTION_MODEL_URI: models:/taxi-duration/Production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Check MAE regression
        run: |
          uv run python scripts/check_mae_regression.py \
            --new-metrics metrics/new_run.json \
            --production-metrics metrics/production.json \
            --max-regression-percent 5
