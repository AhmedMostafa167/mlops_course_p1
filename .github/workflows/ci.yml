name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "latest" }
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run black --check src tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "latest" }
      - run: uv sync --group dev
      - run: uv run pytest
      - run: |
          uv run python scripts/check_mae_regression.py \
            --new-metrics metrics/new_run.json \
            --production-metrics metrics/production.json \
            --max-regression-percent 5
